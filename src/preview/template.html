<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
{{CSS}}
  </style>
</head>
<body>
<div class="vsmd-container" data-theme="default">
  <div class="vsmd-content" id="preview-body">
    <div class="vsmd-content-inner">
{{CONTENT}}
    </div>
  </div>
  <div class="vsmd-sidebar">
    <button class="vsmd-sidebar-btn" id="btn-theme" title="切换主题">{{SVG_THEME}}</button>
    <button class="vsmd-sidebar-btn" id="btn-mobile" title="移动端模式">{{SVG_PHONE}}</button>
    <button class="vsmd-sidebar-btn close" id="btn-close" title="关闭预览">{{SVG_EXIT}}</button>
  </div>
</div>

<div class="vsmd-theme-overlay" id="theme-overlay">
  <div class="vsmd-theme-box">
    <h3>选择主题</h3>
    
    <div class="vsmd-theme-section">
      <div class="vsmd-theme-section-title">显示模式</div>
      <div class="vsmd-theme-radio-list" id="theme-mode-list"></div>
    </div>
    
    <div class="vsmd-theme-section" id="theme-market-section" style="display:none;">
      <div class="vsmd-theme-section-title">主题市场</div>
      <div class="vsmd-theme-market-list" id="theme-market-list"></div>
    </div>
    
    <button class="close-btn" id="close-theme">关闭</button>
  </div>
</div>

<script>
{{JS}}
</script>
</body>
</html>
